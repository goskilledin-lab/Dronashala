<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C060"/>
      <stop offset="1" stop-color="#B0763C"/>
    </linearGradient>
  </defs>
  <!-- full-bleed obsidian background (required for maskable safe-zone) -->
  <rect x="0" y="0" width="512" height="512" fill="#07090D"/>
  <!-- thin bronze mandala ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#dgrad)" stroke-width="3" opacity="0.8"/>
  <g stroke="url(#dgrad)" stroke-width="3" opacity="0.6">
    <line x1="256" y1="76" x2="256" y2="96"/>
    <line x1="256" y1="416" x2="256" y2="436"/>
    <line x1="76" y1="256" x2="96" y2="256"/>
    <line x1="416" y1="256" x2="436" y2="256"/>
    <line x1="136.7" y1="136.7" x2="151.5" y2="151.5"/>
    <line x1="360.5" y1="360.5" x2="375.3" y2="375.3"/>
    <line x1="375.3" y1="136.7" x2="360.5" y2="151.5"/>
    <line x1="151.5" y1="360.5" x2="136.7" y2="375.3"/>
  </g>
  <!-- engraved "D" monogram -->
  <path d="M210,150 L210,362 M210,150 A108,108 0 0 1 210,362"
        fill="none" stroke="url(#dgrad)" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
